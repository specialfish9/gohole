name: Release

env:
  DOCKER_IMAGE: gohole
  DOCKER_USER: specialfish9

on:
  push:
    branches: ["master"]

jobs:
  tag:
    name: Tag release
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        id: semantic
        with:
          semantic_version: 24.2.5
          extra_plugins: |
            @semantic-release/commit-analyzer@13
            @semantic-release/release-notes-generator@14
            @semantic-release/changelog@6
            @semantic-release/exec@7
            @semantic-release/github@11
            conventional-changelog-conventionalcommits@9
            conventional-changelog-angular@8
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
    outputs:
      version: ${{ steps.semantic.outputs.new_release_version }}

  build-amd64:
    name: Build and publish Docker image (amd64)
    needs: tag
    runs-on: ubuntu-latest
    if: needs.tag.outputs.version != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PWD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          tags: |
            ${{ env.DOCKER_USER }}/${{ env.DOCKER_IMAGE }}:${{ needs.tag.outputs.version }}-amd64
          provenance: false

  build-arm64:
    name: Build and publish Docker image (arm64)
    needs: tag
    runs-on: ubuntu-latest
    if: needs.tag.outputs.version != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PWD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          tags: |
            ${{ env.DOCKER_USER }}/${{ env.DOCKER_IMAGE }}:${{ needs.tag.outputs.version }}-arm64
          provenance: false

  create-manifest:
    name: Create multi-platform manifest
    needs: [tag, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PWD }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.DOCKER_USER }}/${{ env.DOCKER_IMAGE }}:latest \
            -t ${{ env.DOCKER_USER }}/${{ env.DOCKER_IMAGE }}:${{ needs.tag.outputs.version }} \
            ${{ env.DOCKER_USER }}/${{ env.DOCKER_IMAGE }}:${{ needs.tag.outputs.version }}-amd64 \
            ${{ env.DOCKER_USER }}/${{ env.DOCKER_IMAGE }}:${{ needs.tag.outputs.version }}-arm64
