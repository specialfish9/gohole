app:
  log_level: "debug"

http:
  address: ":8080"
  serve_frontend: true

dns:
  address: ":8054"
  upstream: "1.1.1.1"
  cache: true

db:
  type: "postgres"
  address: "localhost:5432"
  user: "gohole"
  password: "password"
  name: "gohole"
  debug: false

blocking:
  filter_strategy: "basic"
  blocklist_file: "block.txt"
  local_blocklist: "localblock.txt"
  local_allowlist: "localallow.txt"
